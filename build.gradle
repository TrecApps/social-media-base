plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'jacoco'

    id "io.spring.dependency-management" version "1.1.0"
}

dependencyManagement {
    imports {
        mavenBom("com.azure.spring:spring-cloud-azure-dependencies:7.0.0")
    }
}

//ext {
//    springbootVersion = '4.0.0'
//}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

group = 'com.trecapps'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()

    maven {
        url azureRepoUrl
        name 'tcMavenRepo'
        credentials {
            username azureRepoUsername
            password azureRepoPassword
        }
    }
}

jar{
    //archiveClassifier=''
    enabled = false
}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // Basic Security help
    implementation(group: 'com.trecapps.trecauth', name: 'trec-auth-azure', version: '0.0.60')
    implementation(group: 'com.trecapps.trecauth', name: 'trec-auth-mongo', version: '0.0.60')

    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation("org.springframework.boot:spring-boot-starter-webflux")
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-quartz"
    implementation "org.springframework.boot:spring-boot-starter-data-mongodb-reactive"
    implementation "org.springframework.boot:spring-boot-starter-data-cassandra-reactive" // Connections and Reactions
    implementation "org.springframework.boot:spring-boot-starter-aspectj"

    // Azure Logging
    implementation "com.microsoft.azure:applicationinsights-runtime-attach:3.7.6"
    implementation "com.azure.spring:spring-cloud-azure-starter-keyvault"
    implementation 'com.azure:azure-messaging-servicebus'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}